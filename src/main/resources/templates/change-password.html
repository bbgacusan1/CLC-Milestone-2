<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 32rem;">
    <h1 class="mb-4">Change Password</h1>

    <form th:action="@{/change-password}" th:object="${passwordChange}" method="post" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>

        <div class="mb-3">
            <label class="form-label" for="currentPassword">Current password</label>
            <input class="form-control" type="password" id="currentPassword" name="currentPassword"
                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="newPassword">New password</label>
            <input class="form-control" type="password" id="newPassword" name="newPassword"
                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm new password</label>
            <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Change Password</button>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
