<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('User Administration')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h1 class="mb-4">User Administration</h1>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
                <th>Password Change</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4" class="text-center text-muted">No users found.</td>
            </tr>
            <tr th:each="user : ${users}">
                <td th:text="${user.username}"></td>

                <td>
                    <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-flex gap-2">
                        <select name="role" class="form-select form-select-sm" style="width: auto;">
                            <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                            <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                    </form>
                </td>

                <td>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge"
                              th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'"
                              th:text="${user.enabled} ? 'Enabled' : 'Disabled'"></span>
                        <form th:action="@{/admin/users/{id}/enabled(id=${user.id})}" method="post">
                            <input type="hidden" name="enabled" th:value="${!user.enabled}">
                            <button type="submit"
                                    class="btn btn-sm"
                                    th:classappend="${user.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                    th:text="${user.enabled} ? 'Disable' : 'Enable'"></button>
                        </form>
                    </div>
                </td>

                <td>
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge"
                              th:classappend="${user.passwordChangeRequired} ? 'bg-warning text-dark' : 'bg-light text-dark border'"
                              th:text="${user.passwordChangeRequired} ? 'Required' : 'Not Required'"></span>
                        <form th:action="@{/admin/users/{id}/password-change(id=${user.id})}" method="post">
                            <input type="hidden" name="passwordChangeRequired" th:value="${!user.passwordChangeRequired}">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-secondary"
                                    th:text="${user.passwordChangeRequired} ? 'Clear' : 'Require'"></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
